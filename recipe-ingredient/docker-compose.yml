

services:
  postgres:
    image: postgres:latest
    container_name: postgres_recipe_ingredient
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recipe_ingredient_db
    ports:
      - "5434:5432"
    volumes:
      - ./postgres_data/recipe_ingredient_db:/var/lib/postgresql/data
  
  
